name: Build

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
      - name: Build NAME (Release)
        run: |
          xcodebuild -project NAME.xcodeproj -scheme NAME -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual build
      - name: Verify signature (ad-hoc)
        run: codesign --verify --deep --strict build/DerivedData/Build/Products/Release/NAME.app
      - name: Upload NAME.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAME-app
          path: build/DerivedData/Build/Products/Release/NAME.app
